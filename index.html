<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pico Park - Room Code Multi Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b0c10; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-panel {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            padding: 16px; width: 280px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #ui-panel h2 { font-size: 18px; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        
        .room-box {
            background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: center;
        }
        .room-code {
            font-size: 24px; font-weight: bold; color: #38bdf8; letter-spacing: 4px; font-family: monospace; margin: 4px 0;
        }
        
        input[type="text"] {
            width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 14px; outline: none; text-align: center; letter-spacing: 2px;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        button {
            width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: none;
            background: #0284c7; color: white; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: #0369a1; }
        button.host-btn { background: #10b981; }
        button.host-btn:hover { background: #059669; }
        
        #status-text { font-size: 12px; margin-top: 8px; color: #fbbf24; text-align: center; }
        
        #stage-badge {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;
            padding: 12px 20px; font-size: 18px; font-weight: 700; color: #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #controls-guide {
            position: absolute; bottom: 15px; left: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
            padding: 12px 16px; font-size: 12px; color: #cbd5e1; line-height: 1.6;
        }
        
        /* Mobile Touch Controls */
        #touch-controls {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px;
        }
        .touch-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: white; font-size: 18px; display: flex;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .touch-btn:active { background: rgba(56, 189, 248, 0.4); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (min-width: 768px) {
            #touch-controls { display: none; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>🎮 3D Pico Park</h2>
        
        <!-- 방 만들기 섹션 -->
        <div class="room-box">
            <button class="host-btn" onclick="createRoom()">🏠 방 만들기 (4자리 코드)</button>
            <div id="host-code-display" style="display:none; margin-top:8px;">
                <span style="font-size:12px; color:#94a3b8;">생성된 방 코드</span>
                <div id="room-code-num" class="room-code">----</div>
            </div>
        </div>

        <!-- 방 입장 섹션 -->
        <div style="margin-top: 10px;">
            <input type="text" id="join-code" placeholder="4자리 방 코드 입력" maxlength="4">
            <button onclick="joinRoom()">입장하기</button>
        </div>

        <div id="status-text">상태: 대기 중</div>
    </div>

    <div id="stage-badge">STAGE <span id="stage-num">1</span> / 3</div>

    <div id="controls-guide">
        💡 <b>플레이 방법:</b><br>
        - 한 명은 [방 만들기], 다른 한 명은 4자리 코드로 [입장하기]<br>
        - 노란 스위치 2개를 동시에 밟으면 문이 열립니다.<br>
        - 두 플레이어가 모두 파란 구체(골인)에 닿으면 클리어!
    </div>

    <div id="touch-controls">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <script>
        // --- 1. Stage Data Definition ---
        const STAGES = [
            {
                name: "Stage 1: 기본 협동",
                floor: { w: 18, h: 18 },
                switches: [{ x: -4, z: -2 }, { x: 4, z: -2 }],
                door: { x: 0, z: -5, w: 4, h: 3 },
                goal: { x: 0, z: -8 },
                spawns: [{ x: -2, z: 4 }, { x: 2, z: 4 }]
            },
            {
                name: "Stage 2: 양끝 교차 기믹",
                floor: { w: 14, h: 22 },
                switches: [{ x: -5, z: 1 }, { x: 5, z: 1 }],
                door: { x: 0, z: -4, w: 3, h: 3 },
                goal: { x: 0, z: -8 },
                spawns: [{ x: -1.5, z: 7 }, { x: 1.5, z: 7 }]
            },
            {
                name: "Stage 3: 장거리 레이스",
                floor: { w: 22, h: 26 },
                switches: [{ x: -7, z: -3 }, { x: 7, z: -3 }],
                door: { x: 0, z: -7, w: 5, h: 3 },
                goal: { x: 0, z: -10 },
                spawns: [{ x: -2.5, z: 9 }, { x: 2.5, z: 9 }]
            }
        ];

        let currentStageIdx = 0;

        // --- 2. Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 15);
        camera.lookAt(0, 0, -1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Objects Containers
        let floorMesh, doorMesh, goalMesh;
        let switchMeshes = [];

        // Players (P1: Green/Me, P2: Pink/Friend)
        const playerGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
        
        const p1Mat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 });
        const p1Mesh = new THREE.Mesh(playerGeo, p1Mat);
        p1Mesh.castShadow = true;
        scene.add(p1Mesh);

        const p2Mat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3 });
        const p2Mesh = new THREE.Mesh(playerGeo, p2Mat);
        p2Mesh.castShadow = true;
        scene.add(p2Mesh);

        // --- 3. Stage Builder ---
        function buildStage(idx) {
            const data = STAGES[idx];
            document.getElementById('stage-num').innerText = idx + 1;

            if (floorMesh) scene.remove(floorMesh);
            if (doorMesh) scene.remove(doorMesh);
            if (goalMesh) scene.remove(goalMesh);
            switchMeshes.forEach(s => scene.remove(s));
            switchMeshes = [];

            // Floor
            const floorGeo = new THREE.BoxGeometry(data.floor.w, 0.4, data.floor.h);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.position.set(0, -0.2, 0);
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Switches
            data.switches.forEach(sw => {
                const swGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.15, 24);
                const swMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.2 });
                const swMesh = new THREE.Mesh(swGeo, swMat);
                swMesh.position.set(sw.x, 0.08, sw.z);
                swMesh.receiveShadow = true;
                scene.add(swMesh);
                switchMeshes.push(swMesh);
            });

            // Door
            const doorGeo = new THREE.BoxGeometry(data.door.w, data.door.h, 0.4);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });
            doorMesh = new THREE.Mesh(doorGeo, doorMat);
            doorMesh.position.set(data.door.x, data.door.h / 2, data.door.z);
            doorMesh.castShadow = true;
            scene.add(doorMesh);

            // Goal
            const goalGeo = new THREE.SphereGeometry(0.8, 24, 24);
            const goalMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, wireframe: true });
            goalMesh = new THREE.Mesh(goalGeo, goalMat);
            goalMesh.position.set(data.goal.x, 0.9, data.goal.z);
            scene.add(goalMesh);

            // Spawns
            p1Mesh.position.set(data.spawns[0].x, 0.45, data.spawns[0].z);
            p2Mesh.position.set(data.spawns[1].x, 0.45, data.spawns[1].z);
        }

        buildStage(0);

        // --- 4. Controls & Input ---
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const touchState = { up: false, down: false, left: false, right: false };
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', e => { e.preventDefault(); touchState[key] = true; });
            btn.addEventListener('touchend', e => { e.preventDefault(); touchState[key] = false; });
            btn.addEventListener('mousedown', e => { touchState[key] = true; });
            btn.addEventListener('mouseup', e => { touchState[key] = false; });
        };
        bindTouch('btn-up', 'up');
        bindTouch('btn-down', 'down');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        // --- 5. Simplified Room-Code PeerJS Logic ---
        let peer = null;
        let conn = null;
        const PREFIX = "pico-park-room-";

        // 방 만들기 (4자리 숫자 ID 생성)
        function createRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            const fullId = PREFIX + roomCode;

            if (peer) peer.destroy();
            peer = new Peer(fullId);

            peer.on('open', id => {
                document.getElementById('host-code-display').style.display = 'block';
                document.getElementById('room-code-num').innerText = roomCode;
                setStatus(`방 생성 완료! 코드: ${roomCode} (친구를 기다리는 중...)`, "#fbbf24");
            });

            peer.on('connection', connection => {
                conn = connection;
                initConnection();
            });

            peer.on('error', err => {
                if(err.type === 'unavailable-id') {
                    createRoom(); // 중복 시 재시도
                } else {
                    setStatus("방 생성 중 오류 발생", "#ef4444");
                }
            });
        }

        // 방 입장하기
        function joinRoom() {
            const code = document.getElementById('join-code').value.trim();
            if (code.length !== 4) return alert("4자리 방 코드를 정확히 입력하세요.");

            const targetId = PREFIX + code;
            if (peer) peer.destroy();
            peer = new Peer();

            peer.on('open', () => {
                setStatus("방 접속 시도 중...", "#fbbf24");
                conn = peer.connect(targetId);
                initConnection();
            });

            peer.on('error', err => {
                setStatus("방을 찾을 수 없거나 접속할 수 없습니다.", "#ef4444");
            });
        }

        function initConnection() {
            conn.on('open', () => {
                setStatus("연결 성공! 게임을 시작하세요 🟢", "#10b981");
            });

            conn.on('data', data => {
                p2Mesh.position.set(data.x, data.y, data.z);

                if (data.stage !== undefined && data.stage !== currentStageIdx) {
                    currentStageIdx = data.stage;
                    buildStage(currentStageIdx);
                }
            });
        }

        function setStatus(msg, color) {
            const el = document.getElementById('status-text');
            el.innerText = msg;
            el.style.color = color;
        }

        // --- 6. Main Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.12;
            let moved = false;

            if (keys['w'] || keys['arrowup'] || touchState.up) { p1Mesh.position.z -= speed; moved = true; }
            if (keys['s'] || keys['arrowdown'] || touchState.down) { p1Mesh.position.z += speed; moved = true; }
            if (keys['a'] || keys['arrowleft'] || touchState.left) { p1Mesh.position.x -= speed; moved = true; }
            if (keys['d'] || keys['arrowright'] || touchState.right) { p1Mesh.position.x += speed; moved = true; }

            // Switches
            let activeSwitches = 0;
            switchMeshes.forEach(sw => {
                const dist1 = p1Mesh.position.distanceTo(sw.position);
                const dist2 = p2Mesh.position.distanceTo(sw.position);

                if (dist1 < 0.9 || dist2 < 0.9) {
                    sw.material.color.setHex(0x10b981);
                    activeSwitches++;
                } else {
                    sw.material.color.setHex(0xf59e0b);
                }
            });

            // Door
            const doorData = STAGES[currentStageIdx].door;
            if (activeSwitches >= switchMeshes.length && switchMeshes.length > 0) {
                if (doorMesh.position.y < 4.5) doorMesh.position.y += 0.08;
            } else {
                if (doorMesh.position.y > doorData.h / 2) doorMesh.position.y -= 0.08;
            }

            // Door Collision
            if (doorMesh.position.y < 2.5) {
                if (Math.abs(p1Mesh.position.z - doorData.z) < 0.5 &&
                    Math.abs(p1Mesh.position.x - doorData.x) < doorData.w / 2) {
                    p1Mesh.position.z += 0.15;
                }
            }

            // Goal
            const d1 = p1Mesh.position.distanceTo(goalMesh.position);
            const d2 = p2Mesh.position.distanceTo(goalMesh.position);

            if (d1 < 1.2 && d2 < 1.2) {
                if (currentStageIdx < STAGES.length - 1) {
                    currentStageIdx++;
                    buildStage(currentStageIdx);
                    alert(`🎉 STAGE ${currentStageIdx} 클리어! 다음 스테이지로 이동합니다.`);
                } else {
                    alert("🏆 축하합니다! 모든 스테이지를 클리어했습니다!");
                }
            }

            // Send Sync Data
            if (moved && conn && conn.open) {
                conn.send({
                    x: p1Mesh.position.x,
                    y: p1Mesh.position.y,
                    z: p1Mesh.position.z,
                    stage: currentStageIdx
                });
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
