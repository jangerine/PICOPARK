<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico Park - Stage 1-1 Key Carrier Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: 'Pretendard', -apple-system, sans-serif; background-color: #0b0c10; color: #fff; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-panel {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            padding: 16px; width: 280px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #ui-panel h2 { font-size: 18px; margin-bottom: 12px; color: #38bdf8; }
        
        .room-box { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .room-code { font-size: 24px; font-weight: bold; color: #38bdf8; letter-spacing: 4px; font-family: monospace; margin: 4px 0; }
        
        input[type="text"] {
            width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 14px; outline: none; text-align: center;
        }
        
        button {
            width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: none;
            background: #0284c7; color: white; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        button:hover { background: #0369a1; }
        button.host-btn { background: #10b981; }
        button.host-btn:hover { background: #059669; }
        
        #status-text { font-size: 12px; margin-top: 8px; color: #fbbf24; text-align: center; }
        
        #stage-badge {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;
            padding: 12px 20px; font-size: 16px; font-weight: 700; color: #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #controls-guide {
            position: absolute; bottom: 15px; left: 15px; z-index: 10;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
            padding: 12px 16px; font-size: 12px; color: #cbd5e1; line-height: 1.6;
        }
        
        /* Mobile Controls */
        #touch-controls {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px;
        }
        .touch-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; color: white; font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (min-width: 768px) { #touch-controls { display: none; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>🔑 Pico Park STAGE 1-1</h2>
        
        <div class="room-box">
            <button class="host-btn" onclick="createRoom()">🏠 방 만들기</button>
            <div id="host-code-display" style="display:none; margin-top:8px;">
                <span style="font-size:12px; color:#94a3b8;">생성된 방 코드</span>
                <div id="room-code-num" class="room-code">----</div>
            </div>
        </div>

        <div style="margin-top: 10px;">
            <input type="text" id="join-code" placeholder="4자리 방 코드" maxlength="4">
            <button onclick="joinRoom()">입장하기</button>
        </div>

        <div id="status-text">상태: 대기 중</div>
    </div>

    <div id="stage-badge">STAGE 1-1 : KEY CARRIER</div>

    <div id="controls-guide">
        🎯 <b>원작 미션:</b><br>
        1. 공중에 떠 있는 <b>노란 열쇠</b>를 획득하세요.<br>
        2. 열쇠 구멍이 높이 있으므로 <b>친구 위에 올라타서(스태킹)</b> 열쇠를 꽂으세요.<br>
        3. 닫힌 문이 열리면 둘 다 오른쪽 <b>Door로 골인</b>하세요!
    </div>

    <div id="touch-controls">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
    </div>

    <script>
        // --- 1. Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 24);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(0, 15, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. Stage 1-1 Map Objects ---
        const floorGeo = new THREE.BoxGeometry(28, 2, 2);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.position.set(0, -1, 0);
        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // Key Object
        let hasKey = false;
        let keyCarrier = null;
        const keyGeo = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 });
        const keyMesh = new THREE.Mesh(keyGeo, keyMat);
        keyMesh.position.set(-8, 2.5, 0);
        scene.add(keyMesh);

        // Key Hole (Lock Platform)
        const lockGeo = new THREE.BoxGeometry(1.2, 1.2, 0.4);
        const lockMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
        const lockMesh = new THREE.Mesh(lockGeo, lockMat);
        lockMesh.position.set(4, 5.0, 0);
        scene.add(lockMesh);

        // Door Barrier
        let isDoorUnlocked = false;
        const doorGeo = new THREE.BoxGeometry(0.8, 5, 0.8);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
        const doorMesh = new THREE.Mesh(doorGeo, doorMat);
        doorMesh.position.set(9, 2.5, 0);
        scene.add(doorMesh);

        // Goal Door Frame & Area
        const goalGeo = new THREE.BoxGeometry(2.5, 3.5, 0.2);
        const goalMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 });
        const goalMesh = new THREE.Mesh(goalGeo, goalMat);
        goalMesh.position.set(12, 1.75, 0);
        scene.add(goalMesh);

        // Players
        const PLAYER_SIZE = 0.9;
        const playerGeo = new THREE.BoxGeometry(PLAYER_SIZE, PLAYER_SIZE, PLAYER_SIZE);
        
        const p1Mesh = new THREE.Mesh(playerGeo, new THREE.MeshStandardMaterial({ color: 0x10b981 }));
        p1Mesh.position.set(-11, 0.45, 0);
        p1Mesh.castShadow = true;
        scene.add(p1Mesh);

        const p2Mesh = new THREE.Mesh(playerGeo, new THREE.MeshStandardMaterial({ color: 0xf43f5e }));
        p2Mesh.position.set(-9.5, 0.45, 0);
        p2Mesh.castShadow = true;
        scene.add(p2Mesh);

        // Physics State Variables
        let vy = 0;
        const gravity = -0.015;
        const jumpPower = 0.32;
        let isGrounded = false;
        let isClearing = false;

        // Controls
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') keys['space'] = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
            if (e.code === 'Space') keys['space'] = false;
        });

        const touchState = { up: false, left: false, right: false };
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', e => { e.preventDefault(); touchState[key] = true; });
            btn.addEventListener('touchend', e => { e.preventDefault(); touchState[key] = false; });
            btn.addEventListener('mousedown', e => { touchState[key] = true; });
            btn.addEventListener('mouseup', e => { touchState[key] = false; });
        };
        bindTouch('btn-up', 'up');
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        // --- 3. Networking (PeerJS) ---
        let peer = null, conn = null;
        const PREFIX = "pico-park-room-";

        function createRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            if (peer) peer.destroy();
            peer = new Peer(PREFIX + roomCode);

            peer.on('open', () => {
                document.getElementById('host-code-display').style.display = 'block';
                document.getElementById('room-code-num').innerText = roomCode;
                setStatus(`방 코드: ${roomCode} (친구 대기 중)`, "#fbbf24");
            });
            peer.on('connection', connection => { conn = connection; initConnection(); });
        }

        function joinRoom() {
            const code = document.getElementById('join-code').value.trim();
            if (code.length !== 4) return alert("4자리 방 코드를 입력하세요.");
            if (peer) peer.destroy();
            peer = new Peer();

            peer.on('open', () => {
                setStatus("접속 중...", "#fbbf24");
                conn = peer.connect(PREFIX + code);
                initConnection();
            });
        }

        function initConnection() {
            conn.on('open', () => setStatus("연결 완료! 게임 시작 🟢", "#10b981"));
            conn.on('data', data => {
                p2Mesh.position.set(data.x, data.y, 0);
                if (data.hasKey !== undefined) hasKey = data.hasKey;
                if (data.isUnlocked !== undefined) isDoorUnlocked = data.isUnlocked;
            });
        }

        function setStatus(msg, color) {
            const el = document.getElementById('status-text');
            el.innerText = msg; el.style.color = color;
        }

        // --- 4. Main Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.12;
            let moved = false;

            // X Movement
            if (keys['a'] || keys['arrowleft'] || touchState.left) { p1Mesh.position.x -= speed; moved = true; }
            if (keys['d'] || keys['arrowright'] || touchState.right) { p1Mesh.position.x += speed; moved = true; }

            p1Mesh.position.x = Math.max(-13.5, Math.min(13.5, p1Mesh.position.x));

            // Gravity & Vertical Physics
            vy += gravity;
            p1Mesh.position.y += vy;

            // Stacking Engine
            const floorY = 0.45;
            let groundY = floorY;

            const dx = Math.abs(p1Mesh.position.x - p2Mesh.position.x);
            const p2HeadY = p2Mesh.position.y + PLAYER_SIZE;

            if (dx < PLAYER_SIZE * 0.85 && p1Mesh.position.y >= p2Mesh.position.y) {
                groundY = Math.max(floorY, p2HeadY);
            }

            if (p1Mesh.position.y <= groundY) {
                p1Mesh.position.y = groundY;
                vy = 0;
                isGrounded = true;
            } else {
                isGrounded = false;
            }

            // Jump
            if ((keys['w'] || keys['arrowup'] || keys['space'] || touchState.up) && isGrounded) {
                vy = jumpPower;
                isGrounded = false;
                moved = true;
            }

            // Key Pick Up Check
            if (!hasKey) {
                if (p1Mesh.position.distanceTo(keyMesh.position) < 1.0) {
                    hasKey = true;
                    keyCarrier = 1;
                } else if (p2Mesh.position.distanceTo(keyMesh.position) < 1.0) {
                    hasKey = true;
                    keyCarrier = 2;
                }
            } else {
                if (keyCarrier === 1) keyMesh.position.set(p1Mesh.position.x, p1Mesh.position.y + 0.8, 0);
                else keyMesh.position.set(p2Mesh.position.x, p2Mesh.position.y + 0.8, 0);

                if (keyMesh.position.distanceTo(lockMesh.position) < 1.2) {
                    isDoorUnlocked = true;
                    scene.remove(keyMesh);
                }
            }

            // Door Opening Logic
            if (isDoorUnlocked) {
                if (doorMesh.position.y < 5.5) doorMesh.position.y += 0.08;
            } else {
                if (Math.abs(p1Mesh.position.x - doorMesh.position.x) < 0.6 && p1Mesh.position.y < 4) {
                    p1Mesh.position.x = doorMesh.position.x - 0.6;
                }
            }

            // 🎯 [개선된 골인 판정] 
            // 파란색 문 영역(X: 10.75 ~ 13.25)에 플레이어 2명이 모두 들어왔는지 사각형 영역으로 체크
            const inGoalP1 = (p1Mesh.position.x >= 10.5 && p1Mesh.position.x <= 13.5);
            const inGoalP2 = (p2Mesh.position.x >= 10.5 && p2Mesh.position.x <= 13.5);

            if (inGoalP1 && inGoalP2 && !isClearing) {
                isClearing = true; // 중복 실행 방지
                setTimeout(() => {
                    alert("🎉 STAGE 1-1 Key Carrier 클리어!");
                    
                    // Reset Game State
                    p1Mesh.position.set(-11, 0.45, 0);
                    p2Mesh.position.set(-9.5, 0.45, 0);
                    hasKey = false;
                    isDoorUnlocked = false;
                    doorMesh.position.set(9, 2.5, 0);
                    scene.add(keyMesh);
                    keyMesh.position.set(-8, 2.5, 0);
                    isClearing = false;
                }, 100);
            }

            // Sync Multi
            if ((moved || vy !== 0) && conn && conn.open) {
                conn.send({
                    x: p1Mesh.position.x,
                    y: p1Mesh.position.y,
                    hasKey: hasKey,
                    isUnlocked: isDoorUnlocked
                });
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
